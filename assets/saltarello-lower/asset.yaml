id: saltarello-lower
title: Saltarello margin rod, lower
description: "A bottom-left corner piece for a left margin: a vertical gold rod edged in red, from which a horizontal spray of red and blue acanthus, green leaves and gold scrolls with white five-petal flowers and red berries grows to the right along the bottom; the rod runs up to the top edge of the canvas, cut so a drawn rule can continue it. Transparent background."
